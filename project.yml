name: Earshot
options:
  bundleIdPrefix: studio.noisyneighbor
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: P8ZBH5878Q
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  configs:
    # Only Release builds check for updates. The feed is R2 bucket `earshot-releases` (scripts/publish-appcast.sh);
    # the key is login-keychain account `earshot` (generate_keys --account earshot -p).
    Release:
      EARSHOT_FEED_URL: https://earshot-updates.noisyneighbor.studio/appcast.xml
      EARSHOT_ED_PUBLIC_KEY: I6mvrZnbVwAeSfz9qyWdDw7EeuujnT7sUuly59RPeik=
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  # Our fork: upstream 59fbf14 (past 0.9.0, which doesn't compile under Swift 6.4) plus a fix for
  # StdioTransport trapping when stdio is a socketpair (st_dev == -1), which is how Node-based
  # agents (Claude Desktop, Claude Code) launch MCP servers. Return upstream once that's fixed there.
  MCP:
    url: https://github.com/noisyneighborstudio/swift-sdk
    revision: b7a26b8d887fda9389a81f0c5feaa34e3d7e8ff7
targets:
  Earshot:
    type: application
    platform: macOS
    sources:
      - path: Earshot
        excludes: [Extension]
      - Shared
    dependencies:
      - package: Sparkle
      # The MCP helper ships in Contents/MacOS, signed with the app.
      - target: EarshotMCP
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Earshot/Support/Info.plist
      properties:
        CFBundleName: $(EARSHOT_APP_NAME)
        CFBundleDisplayName: $(EARSHOT_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        SUFeedURL: $(EARSHOT_FEED_URL)
        SUPublicEDKey: $(EARSHOT_ED_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        NSMicrophoneUsageDescription: Earshot listens while you hold the hotkey so it can turn your voice into text.
        NSAudioCaptureUsageDescription: Earshot transcribes call audio so it can write notes for meetings you choose to record.
    entitlements:
      path: Earshot/Support/Earshot.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: NN Earshot
        PRODUCT_MODULE_NAME: Earshot
        PRODUCT_BUNDLE_IDENTIFIER: studio.noisyneighbor.earshot
        EARSHOT_APP_NAME: NN Earshot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Its own identity, so dev builds keep separate privacy grants (TCC pins them to the
      # signing certificate) and settings from the installed release.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: studio.noisyneighbor.earshot.dev
          EARSHOT_APP_NAME: NN Earshot Dev
    postBuildScripts:
      # Before code signing, so the app's signature covers it.
      - name: Claude Desktop extension
        script: scripts/build-mcpb.sh "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/NN Earshot.mcpb" "$MARKETING_VERSION"
        inputFiles:
          - $(SRCROOT)/scripts/build-mcpb.sh
          - $(SRCROOT)/Earshot/Extension/manifest.json
          - $(SRCROOT)/Earshot/Extension/earshot
          - $(SRCROOT)/Earshot/Extension/DeveloperIDG2CA.pem
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/NN Earshot.mcpb
    scheme:
      testTargets: [EarshotTests]
  EarshotMCP:
    type: tool
    platform: macOS
    sources: [EarshotMCP, Shared]
    dependencies:
      - package: MCP
    settings:
      base:
        PRODUCT_NAME: earshot-mcp
        PRODUCT_MODULE_NAME: EarshotMCP
        PRODUCT_BUNDLE_IDENTIFIER: studio.noisyneighbor.earshot.mcp
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # Only the app archives; the helper rides inside it.
        SKIP_INSTALL: YES
  EarshotTests:
    type: bundle.unit-test
    platform: macOS
    sources: [EarshotTests]
    dependencies:
      - target: Earshot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: studio.noisyneighbor.earshot.tests
        # The app's product name ("NN Earshot") differs from its target name.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NN Earshot.app/Contents/MacOS/NN Earshot"
        BUNDLE_LOADER: "$(TEST_HOST)"
